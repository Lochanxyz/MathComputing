
name: Build Mathematical Computing APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*Android_Source*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Android source ZIP missing. Upload MathComputingAndroid_Source.zip to the repository root."
            exit 1
          fi
          mkdir android-project
          unzip -q "$ZIP" -d android-project

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Android app
        run: |
          cd android-project/MathComputingAndroid
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Mathematical-Computing-APK
          path: android-project/MathComputingAndroid/app/build/outputs/apk/debug/*.apk
          
